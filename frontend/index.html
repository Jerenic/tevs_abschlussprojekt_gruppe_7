<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verteiltes Commandcenter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background:
        linear-gradient(135deg, rgba(6, 78, 59, 0.18), transparent 42%),
        linear-gradient(220deg, rgba(14, 116, 144, 0.20), transparent 48%),
        #111827;
      color: #e5e7eb;
    }
    header {
      padding: 28px clamp(18px, 4vw, 56px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.22);
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1;
      color: #f8fafc;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 10px 0 0;
      color: #99f6e4;
      font-size: 15px;
    }
    .node-indicator {
      min-width: 220px;
      padding: 14px 16px;
      border: 1px solid rgba(45, 212, 191, 0.35);
      background: rgba(15, 23, 42, 0.72);
      border-radius: 8px;
      text-align: right;
    }
    .node-indicator span {
      display: block;
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
    }
    .node-indicator strong {
      display: block;
      margin-top: 4px;
      color: #2dd4bf;
      font-size: 18px;
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 28px auto;
      display: grid;
      grid-template-columns: minmax(280px, 390px) 1fr;
      gap: 24px;
    }
    section {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 8px;
      padding: 22px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
    }
    h2 {
      margin: 0 0 18px;
      font-size: 18px;
      color: #f8fafc;
    }
    form {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 7px;
      color: #a7f3d0;
      font-size: 13px;
    }
    input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(2, 6, 23, 0.68);
      color: #f8fafc;
      border-radius: 6px;
      padding: 11px 12px;
      font-size: 15px;
    }
    input:focus {
      outline: 2px solid rgba(45, 212, 191, 0.55);
      border-color: transparent;
    }
    .coords {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      background: #14b8a6;
      color: #042f2e;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
    }
    button:hover { background: #5eead4; }
    button.secondary {
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    button.danger {
      background: rgba(248, 113, 113, 0.12);
      color: #fecaca;
      border: 1px solid rgba(248, 113, 113, 0.45);
      padding: 7px 10px;
      font-size: 13px;
    }
    .message {
      min-height: 20px;
      margin: 12px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }
    .message.ok { color: #86efac; }
    .message.err { color: #fca5a5; }
    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .feed {
      display: grid;
      gap: 12px;
    }
    .status-card {
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(2, 6, 23, 0.48);
      border-radius: 8px;
      padding: 15px;
      display: grid;
      gap: 10px;
    }
    .status-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .username {
      color: #67e8f9;
      font-weight: 800;
      font-size: 17px;
    }
    .status-text { color: #f8fafc; }
    .meta {
      color: #94a3b8;
      font-size: 13px;
    }
    .empty {
      color: #94a3b8;
      border: 1px dashed rgba(148, 163, 184, 0.25);
      border-radius: 8px;
      padding: 18px;
      text-align: center;
    }
    @media (max-width: 820px) {
      header { align-items: flex-start; flex-direction: column; }
      .node-indicator { width: 100%; text-align: left; }
      main { grid-template-columns: 1fr; }
      .coords { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Verteiltes Commandcenter</h1>
      <p class="subtitle">Single URL -> NGINX Loadbalancer -> replizierende Statusnodes</p>
    </div>
    <div class="node-indicator">
      <span>Letzte Backend-Antwort</span>
      <strong id="last-node">noch keine</strong>
    </div>
  </header>

  <main>
    <section>
      <h2>Status senden</h2>
      <form id="status-form">
        <label>Username
          <input id="username" type="text" value="RECON-01" required />
        </label>
        <label>Statustext
          <input id="statustext" type="text" value="Am Weg zum Einsatz" required />
        </label>
        <div class="coords">
          <label>Latitude
            <input id="latitude" type="number" step="any" value="48.2150" required />
          </label>
          <label>Longitude
            <input id="longitude" type="number" step="any" value="16.3850" required />
          </label>
        </div>
        <button type="submit">An Loadbalancer senden</button>
      </form>
      <p id="message" class="message"></p>
    </section>

    <section>
      <div class="feed-header">
        <h2>Globaler Status-Feed</h2>
        <button class="secondary" type="button" id="refresh">Aktualisieren</button>
      </div>
      <div id="feed" class="feed">
        <div class="empty">Noch keine Statusmeldungen geladen.</div>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = "/api";
    const form = document.getElementById("status-form");
    const feed = document.getElementById("feed");
    const message = document.getElementById("message");
    const lastNode = document.getElementById("last-node");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const payload = {
        username: document.getElementById("username").value.trim(),
        statustext: document.getElementById("statustext").value.trim(),
        latitude: Number(document.getElementById("latitude").value),
        longitude: Number(document.getElementById("longitude").value),
      };

      try {
        const response = await fetch(`${API_BASE}/status`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        updateNode(response);
        const body = await response.json();
        if (!response.ok) {
          setMessage(body.error || "Fehler beim Speichern.", "err");
          return;
        }
        setMessage(`Gespeichert ueber ${body.node}. Replikation wurde angestossen.`, "ok");
        await loadStatuses();
      } catch {
        setMessage("Loadbalancer oder Backend nicht erreichbar.", "err");
      }
    });

    document.getElementById("refresh").addEventListener("click", loadStatuses);

    async function loadStatuses() {
      try {
        const response = await fetch(`${API_BASE}/status`);
        updateNode(response);
        const statuses = await response.json();
        renderStatuses(statuses);
      } catch {
        feed.innerHTML = '<div class="empty">Feed konnte nicht geladen werden.</div>';
      }
    }

    async function deleteStatus(username) {
      try {
        const response = await fetch(`${API_BASE}/status/${encodeURIComponent(username)}`, {
          method: "DELETE",
        });
        updateNode(response);
        const body = await response.json();
        if (!response.ok) {
          setMessage(body.error || "Loeschen fehlgeschlagen.", "err");
          return;
        }
        setMessage(`Geloescht ueber ${body.node}.`, "ok");
        await loadStatuses();
      } catch {
        setMessage("Loeschen nicht moeglich, Backend nicht erreichbar.", "err");
      }
    }

    function renderStatuses(statuses) {
      if (!Array.isArray(statuses) || statuses.length === 0) {
        feed.innerHTML = '<div class="empty">Keine aktiven Statusmeldungen vorhanden.</div>';
        return;
      }
      feed.innerHTML = statuses.map((status) => `
        <article class="status-card">
          <div class="status-top">
            <div class="username">${escapeHtml(status.username)}</div>
            <button class="danger" type="button" data-delete="${escapeHtml(status.username)}">Loeschen</button>
          </div>
          <div class="status-text">${escapeHtml(status.statustext)}</div>
          <div class="meta">
            ${status.latitude}, ${status.longitude} | ${formatTime(status.uhrzeit)} | Origin: ${escapeHtml(status.originNode || "-")}
          </div>
        </article>
      `).join("");
      feed.querySelectorAll("[data-delete]").forEach((button) => {
        button.addEventListener("click", () => deleteStatus(button.dataset.delete));
      });
    }

    function updateNode(response) {
      const node = response.headers.get("X-Status-Node");
      if (node) lastNode.textContent = node;
    }

    function setMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function formatTime(value) {
      if (!value) return "-";
      return String(value).replace("T", " ").slice(0, 19);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadStatuses();
  </script>
</body>
</html>
