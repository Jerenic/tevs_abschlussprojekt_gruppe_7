events {}

http {
  upstream status_nodes {
    server node-a:5000 max_fails=1 fail_timeout=5s;
    server node-b:5000 max_fails=1 fail_timeout=5s;
    server node-c:5000 max_fails=1 fail_timeout=5s;
  }

  # Verschluesselter Einstiegspunkt: liefert Frontend und proxyt die API.
  # Es gibt bewusst nur einen HTTPS-Listener (kein HTTP), damit der Zugriff
  # ausschliesslich verschluesselt erfolgt.
  server {
    listen 443 ssl;
    server_name _;

    # Selbstsigniertes Zertifikat (Dev). Erzeugung siehe loadbalancer/certs/README.md.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    root /usr/share/nginx/html;
    index index.html;

    location = /lb-health {
      access_log off;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass https://status_nodes/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_ssl_verify off;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;

      # On a failing/booting node retry the next upstream. non_idempotent also
      # retries POST/DELETE so client writes survive a single node outage; our
      # LWW apply makes a re-sent write safe.
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504 non_idempotent;
      proxy_next_upstream_tries 3;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
