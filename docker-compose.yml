name: tevs-status-commandcenter

# Three equal Flask status nodes behind a single NGINX loadbalancer.
# Each node has its own SQLite file on a private named volume (no shared DB).
# TLS terminates at the loadbalancer; internal traffic uses plain HTTP.

networks:
  tevs_net:
    driver: bridge

volumes:
  node-a-data:
  node-b-data:
  node-c-data:

services:
  node-a:
    build:
      context: .
      dockerfile: Dockerfile
    image: tevs-status-node:latest
    environment:
      NODE_NAME: "Node-A"
      PEERS: "http://node-b:5000,http://node-c:5000"
      DB_PATH: "/data/status.db"
      BOOTSTRAP_TIMEOUT: "8"
    volumes:
      - node-a-data:/data
    expose:
      - "5000"
    networks:
      - tevs_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  node-b:
    image: tevs-status-node:latest
    environment:
      NODE_NAME: "Node-B"
      PEERS: "http://node-a:5000,http://node-c:5000"
      DB_PATH: "/data/status.db"
      BOOTSTRAP_TIMEOUT: "8"
    volumes:
      - node-b-data:/data
    expose:
      - "5000"
    networks:
      - tevs_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  node-c:
    image: tevs-status-node:latest
    environment:
      NODE_NAME: "Node-C"
      PEERS: "http://node-a:5000,http://node-b:5000"
      DB_PATH: "/data/status.db"
      BOOTSTRAP_TIMEOUT: "8"
    volumes:
      - node-c-data:/data
    expose:
      - "5000"
    networks:
      - tevs_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  loadbalancer:
    image: nginx:1.27-alpine
    container_name: tevs-loadbalancer
    ports:
      - "${LOADBALANCER_PORT:-8443}:443"
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./loadbalancer/certs:/etc/nginx/certs:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      node-a:
        condition: service_healthy
      node-b:
        condition: service_healthy
      node-c:
        condition: service_healthy
    networks:
      - tevs_net
